---
# Jafra MCP Server — deployment
# Namespace placeholder: PLACEHOLDER_NAMESPACE  (replaced by installer at apply time)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jafra-mcp
  namespace: PLACEHOLDER_NAMESPACE
  labels:
    app: jafra-mcp
    app.kubernetes.io/component: jafra-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jafra-mcp
  template:
    metadata:
      labels:
        app: jafra-mcp
    spec:
      serviceAccountName: jafra-mcp
      containers:
        - name: jafra-mcp
          image: quay.io/causa-ai-hub/jafra-mcp-server:0.1.0
          ports:
            - containerPort: 8083
              name: http
              protocol: TCP
          env:
            - name: ASYNC_PROFILER_URL
              value: "http://async-profiler.PLACEHOLDER_NAMESPACE.svc.cluster.local:8082"
            - name: MCP_SERVER_PORT
              value: "8083"
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "768Mi"
              cpu: "500m"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jafra-mcp
  namespace: PLACEHOLDER_NAMESPACE
---
apiVersion: v1
kind: Service
metadata:
  name: jafra-mcp
  namespace: PLACEHOLDER_NAMESPACE
  labels:
    app: jafra-mcp
spec:
  type: NodePort
  ports:
    - port: 8083
      targetPort: 8083
      protocol: TCP
      name: http
      nodePort: 30003
  selector:
    app: jafra-mcp
