---
# Causa MCP Server — deployment
# Namespace placeholder: PLACEHOLDER_NAMESPACE  (replaced by installer at apply time)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: causa-mcp
  namespace: PLACEHOLDER_NAMESPACE
  labels:
    app: causa-mcp
    app.kubernetes.io/component: causa-mcp
spec:
  replicas: 1
  # Recreate is required with hostNetwork:true — RollingUpdate causes a port
  # conflict because the new pod tries to bind port 8081 on the node while the
  # old pod still holds it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: causa-mcp
  template:
    metadata:
      labels:
        app: causa-mcp
    spec:
      # hostNetwork gives the pod direct access to the node's network stack,
      # which means NodePort routing (via kube-proxy on the node) is available
      # at localhost. This avoids ClusterIP routing, which is unreliable on Kind
      # clusters running inside Docker/Podman on macOS.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: causa-mcp
          image: quay.io/causa-ai-hub/causa-mcp-server:0.0.1
          ports:
            - containerPort: 8081
              name: http
              protocol: TCP
          env:
            # For Kind targets the installer substitutes PLACEHOLDER_ENGINE_URL
            # with http://localhost:30001 (the causa-backend NodePort) so traffic
            # goes through kube-proxy on the node's network stack rather than
            # through the CNI bridge, which is unreliable on Kind / macOS.
            # For all other targets it uses the ClusterIP DNS name.
            - name: CAUSA_ENGINE_URL
              value: "PLACEHOLDER_ENGINE_URL"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: causa-mcp
  namespace: PLACEHOLDER_NAMESPACE
  labels:
    app: causa-mcp
spec:
  type: NodePort
  ports:
    - port: 8081
      targetPort: 8081
      protocol: TCP
      name: http
      nodePort: 30005
  selector:
    app: causa-mcp
