---
# Service account used by the Cryostat MCP server to authenticate against
# Cryostat's REST/GraphQL API.
#
# Cryostat's default SubjectAccessReview gate checks that the bearer token
# principal has "create pods/exec" in the installation namespace before
# allowing access to recordings and other resources.
# This SA holds exactly that permission — nothing more.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cryostat-mcp-client
  namespace: PLACEHOLDER_NAMESPACE
  labels:
    app.kubernetes.io/name: cryostat-mcp-client
    app.kubernetes.io/component: mcp-server
    app.kubernetes.io/part-of: cryostat-mcp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cryostat-mcp-client
  namespace: PLACEHOLDER_NAMESPACE
  labels:
    app.kubernetes.io/name: cryostat-mcp-client
    app.kubernetes.io/component: mcp-server
    app.kubernetes.io/part-of: cryostat-mcp
rules:
  # Cryostat's default accessReview gate requires "create pods/exec" in the
  # installation namespace. Without this the bearer token presented by the
  # MCP server will be rejected by Cryostat's SubjectAccessReview check and
  # all recording / target operations will return 403.
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cryostat-mcp-client
  namespace: PLACEHOLDER_NAMESPACE
  labels:
    app.kubernetes.io/name: cryostat-mcp-client
    app.kubernetes.io/component: mcp-server
    app.kubernetes.io/part-of: cryostat-mcp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cryostat-mcp-client
subjects:
  - kind: ServiceAccount
    name: cryostat-mcp-client
    namespace: PLACEHOLDER_NAMESPACE
