---
# Source: cryostat-k8s-multi-mcp/templates/serviceaccount.yaml
# Namespace placeholder: PLACEHOLDER_NAMESPACE  (replaced by installer at apply time)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cryostat-mcp-cryostat-k8s-multi-mcp
  namespace: PLACEHOLDER_NAMESPACE
  labels:
    helm.sh/chart: cryostat-k8s-multi-mcp-1.0.0
    app.kubernetes.io/name: cryostat-k8s-multi-mcp
    app.kubernetes.io/instance: cryostat-mcp
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: mcp-server
    app.kubernetes.io/part-of: cryostat-mcp
---
# Source: cryostat-k8s-multi-mcp/templates/clusterrole.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cryostat-mcp-cryostat-k8s-multi-mcp
  labels:
    helm.sh/chart: cryostat-k8s-multi-mcp-1.0.0
    app.kubernetes.io/name: cryostat-k8s-multi-mcp
    app.kubernetes.io/instance: cryostat-mcp
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: mcp-server
    app.kubernetes.io/part-of: cryostat-mcp
rules:
  # Permission to discover Cryostat Custom Resources
  # Required for: Finding Cryostat instances and their target namespaces
  - apiGroups:
      - operator.cryostat.io
    resources:
      - cryostats
    verbs:
      - get      # Get individual CR details
      - list     # List all CRs in the cluster
      - watch    # Watch for CR changes in real-time

  # Permission to discover Services
  # Required for: Determining Cryostat service URLs for connection
  - apiGroups:
      - ""
    resources:
      - services
    verbs:
      - get      # Get individual service details
      - list     # List services in namespaces
